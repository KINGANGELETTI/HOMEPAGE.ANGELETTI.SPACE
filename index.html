<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">Homepage</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
        <span>Home</span>
      </a>
      <a href="settings.html" class="nav-link" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/></svg>
        <span>Settings</span>
      </a>
      <a href="#" id="nav-logout" class="nav-link" title="Logout" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </a>
      <a href="login.html" id="nav-login" class="nav-link" title="Login" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span>Login</span>
      </a>
    </div>
  </nav>
  <main class="home-container">
    <div id="user-info" class="user-info" style="display:none;">
      <div class="user-info-avatar">
        <img id="user-avatar" src="" alt="Profile" style="display:none" />
        <span id="user-avatar-placeholder" class="avatar-placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
      </div>
      <span id="user-display-name" class="user-info-name"></span>
    </div>

    <h1 id="greeting" class="home-greeting"></h1>
    <p id="current-date" class="home-date"></p>

    <form id="search-form" class="search-wrapper" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" class="search-input" type="text" placeholder="Search the web…" autofocus />
    </form>
    <span id="engine-label" class="search-engine-label"></span>

    <!-- Apps Section -->
    <section id="apps-section" class="apps-section">
      <h2 class="apps-title">Apps</h2>
      <div class="apps-grid">
        <button id="app-weather" class="app-btn" type="button">
          <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 11.1-13.9A4.5 4.5 0 0117.5 8h1A2.5 2.5 0 0121 10.5 3.5 3.5 0 0117.5 19z"/></svg>
          <span>Weather</span>
        </button>
        <button id="app-calculator" class="app-btn" type="button">
          <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="18" x2="16" y2="18"/></svg>
          <span>Calculator</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Weather App Modal -->
  <div id="weather-modal" class="modal-overlay" style="display:none;">
    <div class="modal app-modal weather-modal">
      <div class="app-modal-header">
        <h2 class="modal-title">Weather</h2>
        <button id="weather-close" class="app-modal-close" type="button">&times;</button>
      </div>
      <div class="weather-location-bar">
        <select id="weather-location" class="form-select">
          <option value="">Select a city…</option>
          <option value="40.7128,-74.006">New York</option>
          <option value="34.0522,-118.2437">Los Angeles</option>
          <option value="41.8781,-87.6298">Chicago</option>
          <option value="29.7604,-95.3698">Houston</option>
          <option value="33.749,-84.388">Atlanta</option>
          <option value="47.6062,-122.3321">Seattle</option>
          <option value="37.7749,-122.4194">San Francisco</option>
          <option value="25.7617,-80.1918">Miami</option>
          <option value="51.5074,-0.1278">London</option>
          <option value="48.8566,2.3522">Paris</option>
          <option value="35.6762,139.6503">Tokyo</option>
          <option value="55.7558,37.6173">Moscow</option>
          <option value="-33.8688,151.2093">Sydney</option>
          <option value="19.4326,-99.1332">Mexico City</option>
          <option value="52.52,13.405">Berlin</option>
        </select>
        <button id="weather-current-loc" class="btn btn-secondary btn-sm" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
          Current Location
        </button>
      </div>
      <div id="weather-content" class="weather-content">
        <p class="weather-placeholder">Select a city or use your current location to see weather data.</p>
      </div>
    </div>
  </div>

  <!-- Calculator App Modal -->
  <div id="calc-modal" class="modal-overlay" style="display:none;">
    <div class="modal app-modal calc-modal">
      <div class="app-modal-header">
        <h2 class="modal-title">Calculator</h2>
        <button id="calc-close" class="app-modal-close" type="button">&times;</button>
      </div>
      <div id="calc-display" class="calc-display">0</div>
      <div class="calc-grid">
        <button class="calc-btn calc-fn" data-action="clear">AC</button>
        <button class="calc-btn calc-fn" data-action="sign">+/−</button>
        <button class="calc-btn calc-fn" data-action="percent">%</button>
        <button class="calc-btn calc-op" data-action="÷">÷</button>
        <button class="calc-btn" data-action="7">7</button>
        <button class="calc-btn" data-action="8">8</button>
        <button class="calc-btn" data-action="9">9</button>
        <button class="calc-btn calc-op" data-action="×">×</button>
        <button class="calc-btn" data-action="4">4</button>
        <button class="calc-btn" data-action="5">5</button>
        <button class="calc-btn" data-action="6">6</button>
        <button class="calc-btn calc-op" data-action="−">−</button>
        <button class="calc-btn" data-action="1">1</button>
        <button class="calc-btn" data-action="2">2</button>
        <button class="calc-btn" data-action="3">3</button>
        <button class="calc-btn calc-op" data-action="+">+</button>
        <button class="calc-btn calc-zero" data-action="0">0</button>
        <button class="calc-btn" data-action=".">.</button>
        <button class="calc-btn calc-op calc-eq" data-action="=">=</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
