<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">Homepage</a>
    <div class="nav-links">
      <a href="login.html" class="nav-link" title="Login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span>Login</span>
      </a>
    </div>
  </nav>

  <!-- Login Content -->
  <main class="page">
    <h1 class="page-title" id="auth-title">Login</h1>

    <div class="card">
      <h2 class="card-title" id="auth-card-title">Sign in to your account</h2>
      <div class="form-group">
        <label class="form-label" for="auth-username">Username</label>
        <input id="auth-username" class="form-input" type="text" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="auth-password">Password</label>
        <input id="auth-password" class="form-input" type="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <div id="auth-confirm-group" class="form-group" style="display:none;">
        <label class="form-label" for="auth-confirm-password">Confirm Password</label>
        <input id="auth-confirm-password" class="form-input" type="password" placeholder="Confirm your password" autocomplete="new-password" />
      </div>
      <p id="auth-error" class="form-hint" style="color:#ff3b30; display:none;"></p>
    </div>

    <button id="auth-submit" class="btn btn-primary btn-block" style="margin-bottom: 12px;">Login</button>
    <p class="auth-toggle-text">
      <span id="auth-toggle-label">Don't have an account?</span>
      <a href="#" id="auth-toggle-link" class="auth-toggle-link">Create Account</a>
    </p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
