  <main class="page">
    <h1 class="page-title">Settings</h1>

    <!-- Search Engine -->
    <div class="card">
      <h2 class="card-title">Search Engine</h2>
      <div class="form-group">
        <label class="form-label" for="search-engine">Default search engine</label>
        <select id="search-engine" class="form-select">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="yahoo">Yahoo</option>
          <option value="brave">Brave Search</option>
        </select>
        <p class="form-hint">Used when searching from the homepage.</p>
      </div>
    </div>

    <!-- Homepage -->
    <div class="card">
      <h2 class="card-title">Homepage</h2>
      <div class="toggle-row">
        <div>
          <div class="toggle-label-text">Show greeting</div>
          <div class="toggle-desc">Display a time-based greeting message.</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="show-greeting" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label-text">Show date</div>
          <div class="toggle-desc">Display today's date below the greeting.</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="show-date" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="form-group" style="margin-top: 16px;">
        <label class="form-label" for="greeting-name">Greeting name</label>
        <input id="greeting-name" class="form-input" type="text" placeholder="Your name" />
        <p class="form-hint">Personalise the greeting (e.g. "Good morning, Alex").</p>
      </div>
    </div>

    <!-- Appearance -->
    <div class="card">
      <h2 class="card-title">Appearance</h2>
      <div class="form-group">
        <label class="form-label" for="theme">Theme</label>
        <select id="theme" class="form-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Accent colour</label>
        <div class="color-options">
          <button type="button" class="color-swatch" data-color="#0071e3" style="background:#0071e3" title="Blue"></button>
          <button type="button" class="color-swatch" data-color="#34c759" style="background:#34c759" title="Green"></button>
          <button type="button" class="color-swatch" data-color="#ff9500" style="background:#ff9500" title="Orange"></button>
          <button type="button" class="color-swatch" data-color="#ff3b30" style="background:#ff3b30" title="Red"></button>
          <button type="button" class="color-swatch" data-color="#af52de" style="background:#af52de" title="Purple"></button>
          <button type="button" class="color-swatch" data-color="#ff2d55" style="background:#ff2d55" title="Pink"></button>
          <button type="button" class="color-swatch" data-color="#5ac8fa" style="background:#5ac8fa" title="Teal"></button>
        </div>
      </div>
    </div>

    <button id="save-settings" class="btn btn-primary btn-block">Save Settings</button>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
