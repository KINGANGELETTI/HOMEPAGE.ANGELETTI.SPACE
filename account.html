<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">Homepage</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link" title="Home">

        <span>Home</span>

      <a href="settings.html" class="nav-link" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/></svg>
        <span>Settings</span>

      <a href="account.html" class="nav-link" title="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Account</span>
      </a>
    </div>
  </nav>

  <!-- Account Content -->
  <main class="page">
    <h1 class="page-title">Account</h1>

    <!-- Profile Picture -->
    <div class="card">
      <h2 class="card-title">Profile Picture</h2>
      <div class="avatar-section">
        <div class="avatar">
          <img id="avatar-img" src="" alt="Profile picture" style="display:none" />
          <span id="avatar-placeholder" class="avatar-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
        </div>
        <input type="file" id="avatar-input" accept="image/*" hidden />
        <span id="avatar-upload-btn" class="avatar-upload-btn">Upload photo</span>
      </div>
    </div>

    <!-- Personal Info -->
    <div class="card">
      <h2 class="card-title">Personal Information</h2>
      <div class="form-group">
        <label class="form-label" for="display-name">Display name</label>
        <input id="display-name" class="form-input" type="text" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input id="email" class="form-input" type="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea id="bio" class="form-textarea" placeholder="A short bio about yourself…"></textarea>
      </div>
    </div>

    <button id="save-account" class="btn btn-primary btn-block" style="margin-bottom: 12px;">Save Account</button>
    <button id="reset-account" class="btn btn-danger btn-block">Reset Account Data</button>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
